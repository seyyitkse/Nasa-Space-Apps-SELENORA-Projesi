[project]
name = "selenora-backend"
version = "0.1.0"
description = "SELENORA — AI-Assisted Lunar Landing Site Decision Support Platform (backend)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "numpy>=2.1",
    "openai>=1.55",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: tests that call real external services (JPL Horizons or DeepSeek). Run with: pytest -m live",
]
filterwarnings = ["ignore::DeprecationWarning:httpx.*"]
